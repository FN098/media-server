services:
  db:
    image: mysql:8.4
    container_name: media-server-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/local/db/mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "13306:3306"

  redis:
    image: redis:latest
    container_name: media-server-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data

  app-local:
    build:
      context: .
      dockerfile: ./docker/local/app/Dockerfile
    container_name: media-server-app-local
    restart: unless-stopped
    command: sleep infinity
    volumes:
      - ${HOST_MEDIA_ROOT}:/media:rw
    ports:
      - "13000:3000"
    depends_on:
      - db
      - redis

  app:
    build:
      context: .
      dockerfile: ./docker/runtime/app/Dockerfile
      target: runner
    container_name: media-server-app
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MEDIA_ROOT: ${MEDIA_ROOT}
      REDIS_URL: ${REDIS_URL}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      NEXT_PUBLIC_WEB_UI_URL: ${NEXT_PUBLIC_WEB_UI_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ${HOST_MEDIA_ROOT}:/media:rw
    ports:
      - "13001:3000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: ./docker/runtime/app/Dockerfile
      target: worker
    container_name: media-server-worker
    restart: unless-stopped
    environment:
      MEDIA_ROOT: ${MEDIA_ROOT}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ${HOST_MEDIA_ROOT}:/media:rw
    depends_on:
      - redis

  migration:
    build:
      context: .
      dockerfile: ./docker/runtime/app/Dockerfile
      target: migration
    container_name: media-server-migration
    restart: no
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL}
    depends_on:
      - db

  caddy:
    image: caddy:latest
    container_name: media-server-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3（QUIC）用
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data # SSL証明書などを保存
      - caddy_config:/config # Caddyの設定を保存
    environment:
      - ACME_AGREE=true e # Let's Encryptの利用規約に自動同意
    depends_on:
      - app
    profiles:
      - public

volumes:
  db_data:
  redis_data:
  caddy_data:
